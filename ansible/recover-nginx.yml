---
- name: Recover NGINX service
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure NGINX container is running
      community.docker.docker_container:
        name: self-healing-nginx
        state: started
        restart: false

    - name: Ensure NGINX exporter is running
      community.docker.docker_container:
        name: self-healing-infrastructure-nginx-exporter-1
        state: started
        restart: false