

services:
  nginx:
    image: nginx:alpine
    container_name: self-healing-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8085:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - --nginx.scrape-uri=http://nginx:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    restart: unless-stopped

  
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    depends_on:
      - nginx-exporter
    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: self-healing-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped


  recovery-service:
    build:
      context: ./recovery
    container_name: self-healing-recovery
    ports:
      - "5000:5000"
    volumes:
      - ./ansible/recover-nginx.yml:/ansible/recover-nginx.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped